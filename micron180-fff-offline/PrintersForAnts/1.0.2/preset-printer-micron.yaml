# Printer profile for the PrintersForAnts Micron 180 (Klipper).
id: '*default_print_Micron180*'
kind: printer
variants:
# 0.4
- condition: tool.nozzle_diameter == 0.4
  id: TVF3+BGQQWiQswm2an5EFA
  values:
    default_print: '0.20mm STRUCTURAL @Micron 180 0.4'
# 0.6
- condition: tool.nozzle_diameter == 0.6
  id: xRoO2W0INLJgyBn5Wb4L+A
  values:
    default_print: '0.30mm STRUCTURAL @Micron 180 0.6'
---
id: FuOydqdISz+lUe+Aq5SZsg
kind: printer
inherits:
- '*default_print_Micron180*'
variants:
- condition: printer.model == "MICRON180"
  name: 'Micron 180'
  id: f1fYomIcRdqNPM+L3zp5jw
  values:
    autoemit_temperature_commands: 0
    bed_shape: ['0x0', '173x0', '173x173', '0x173']
    before_layer_gcode: |
      ;BEFORE_LAYER_CHANGE
      ;[layer_z]
      G92 E0
    binary_gcode: 0
    end_gcode: 'print_end    ;end script from macro'
    extruder_clearance_radius: 70
    extruder_offset: ['0x0']
    gcode_flavor: klipper
    layer_gcode: |-
      ;AFTER_LAYER_CHANGE
      ;[layer_z]
    machine_limits_usage: time_estimate_only
    machine_max_acceleration_e: [10000, 10000]
    machine_max_acceleration_extruding: [1500, 1500]
    machine_max_acceleration_retracting: [1500, 1500]
    machine_max_acceleration_travel: [1500, 1250]
    machine_max_acceleration_x: [9000, 9000]
    machine_max_acceleration_y: [9000, 9000]
    machine_max_acceleration_z: [500, 500]
    machine_max_feedrate_x: [500, 500]
    machine_max_feedrate_y: [500, 500]
    machine_max_feedrate_z: [12, 12]
    machine_max_jerk_e: [2.5, 2.5]
    machine_max_jerk_x: [10, 10]
    machine_max_jerk_y: [10, 10]
    machine_max_jerk_z: [0.2, 0.2]
    machine_min_extruding_rate: [0, 0]
    machine_min_travel_rate: [0, 0]
    max_print_height: 140
    printer_model: MICRON180
    printer_notes: |-
      Community profile for the PrintersForAnts Micron 180.
      Hotend: E3D V6.
    printer_technology: FFF
    remaining_times: 0
    silent_mode: 0
    start_gcode: |-
      PRINT_START EXTRUDER={first_layer_temperature[initial_tool]} BED={first_layer_bed_temperature[initial_tool]} CHAMBER={chamber_temperature[initial_tool]} CHAMBER_MIN={chamber_minimal_temperature[initial_tool]}
      G0 X20 Y4 F10000   ; Go to starting point
      G0 Z0.4            ; Raise Z to 0.4
      G91                ; Incremental positioning
      G1 X100 E35 F1200  ; Primeline
      G90
    stuck_filament_detection: 0
    thumbnails: ['64x64/PNG', '400x300/PNG']
    use_firmware_retraction: 0
    use_relative_e_distances: 1
    use_volumetric_e: 0
    variable_layer_height: 1
    z_offset: 0
