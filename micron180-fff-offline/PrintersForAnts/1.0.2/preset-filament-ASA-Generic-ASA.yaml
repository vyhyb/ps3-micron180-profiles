# Adapted from Prusa Research 'Generic ASA' (MINI variants).
kind: filament
id: 'Generic ASA @Micron 180'
name: 'Generic ASA @Micron 180'
features:
  $.type: 'ASA'
condition: printer.model == "MICRON180" and (tool.nozzle_diameter == 0.4)
values:
  bed_temperature: 100
  bridge_fan_speed: 30
  chamber_minimal_temperature: 0
  chamber_temperature: 0
  cooling: 1
  cooling_perimeter_transition_distance: 10
  cooling_slowdown_logic: uniform_cooling
  disable_fan_first_layers: 4
  end_filament_gcode: '; Filament-specific end gcode'
  extrusion_multiplier: 1
  fan_always_on: 1
  fan_below_layer_time: 20
  filament_colour: ''
  filament_cost: '45.10'
  filament_density: 1.07
  filament_diameter: 1.75
  filament_infill_max_speed: 0
  filament_notes: ''
  filament_shrinkage_compensation_xy: '0%'
  filament_shrinkage_compensation_z: '0%'
  filament_soluble: 0
  filament_spool_weight: 278
  filament_type: ASA
  filament_vendor: Generic
  first_layer_bed_temperature: 100
  first_layer_temperature: 260
  full_fan_speed_layer: 0
  max_fan_speed: 20
  min_fan_speed: 20
  min_print_speed: 15
  pressure_advance: disabled
  slowdown_below_layer_time: 20
  temperature: 260
variants:
- condition: tool.nozzle_diameter == 0.4
  id: KzB27PYQF2TDgBBdlvYnAA
  values:
    filament_infill_max_crossing_speed: 0
    filament_max_volumetric_speed: 10
