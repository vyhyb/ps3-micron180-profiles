# Print profiles for the PrintersForAnts Micron 180.
# 0.4 nozzle values were ported from the tuned PrusaSlicer 2.9 profiles.
kind: print
id: '*common Micron 180*'
values:
  arc_fitting: emit_center
  bridge_acceleration: 3000
  bridge_speed: 60
  brim_type: outer_only
  brim_width: 0
  default_material: 'Generic PLA @Micron 180'
  deretract_speed: 30
  dont_support_bridges: 1
  elefant_foot_compensation: 0.1
  enable_dynamic_overhang_speeds: 0
  external_perimeters_first: 0
  extra_perimeters: 0
  fill_angle: 45
  first_layer_acceleration_over_raft: 0
  first_layer_height: 0.2
  first_layer_speed_over_raft: 30
  gap_fill_enabled: 1
  gap_fill_speed: 40
  gcode_comments: 0
  gcode_label_objects: disabled
  gcode_resolution: 0.0125
  infill_anchor: 0
  infill_anchor_max: 50
  infill_every_layers: 1
  infill_extruder: 1
  infill_first: 0
  infill_overlap: '20%'
  interface_shells: 0
  max_print_speed: 300
  max_volumetric_extrusion_rate_slope_negative: 0
  max_volumetric_extrusion_rate_slope_positive: 0
  max_volumetric_speed: 0
  min_bead_width: '85%'
  min_feature_size: '25%'
  mmu_segmented_region_max_width: 0
  only_retract_when_crossing_perimeters: 1
  ooze_prevention: 0
  over_bridge_speed: 0
  overhang_speed_0: 15
  overhang_speed_1: 15
  overhang_speed_2: 20
  overhang_speed_3: 25
  overhangs: 1
  perimeter_extruder: 1
  perimeter_generator: arachne
  raft_contact_distance: 0.1
  raft_expansion: 1.5
  raft_first_layer_expansion: 3
  retract_before_travel: 3
  retract_before_wipe: '0%'
  retract_layer_change: 0
  retract_length: 0.75
  retract_lift: 0.4
  retract_lift_above: 0.2
  retract_lift_below: 500
  retract_restart_extra: 0
  retract_speed: 50
  single_extruder_multi_material_priming: 1
  skirt_distance: 3
  skirt_height: 1
  slice_closing_radius: 0.049
  solid_infill_acceleration: 0
  solid_infill_below_area: 0
  solid_infill_every_layers: 0
  solid_infill_extruder: 1
  standby_temperature_delta: -5
  support_material_angle: 0
  support_material_bottom_contact_distance: 0
  support_material_bottom_interface_layers: -1
  support_material_closing_radius: 2
  support_material_enforce_layers: 0
  support_material_extruder: 0
  support_material_interface_contact_loops: 0
  support_material_interface_extruder: 0
  support_material_interface_layers: 1
  support_material_interface_pattern: rectilinear
  support_material_interface_spacing: 0.2
  support_material_interface_speed: 70
  support_material_pattern: rectilinear
  support_material_spacing: 1
  support_material_speed: 90
  support_material_synchronize_layers: 0
  support_material_threshold: 30
  support_material_with_sheath: 0
  support_material_xy_spacing: 0.6
  support_tree_angle: 40
  support_tree_angle_slow: 25
  support_tree_branch_diameter: 2
  support_tree_branch_diameter_angle: 5
  support_tree_branch_diameter_double_wall: 3
  support_tree_branch_distance: 1
  support_tree_tip_diameter: 0.8
  support_tree_top_rate: '15%'
  thick_bridges: 1
  thin_walls: 0
  top_fill_pattern: monotonic
  top_one_perimeter_type: none
  top_solid_infill_acceleration: 0
  travel_max_lift: 0
  travel_ramping_lift: 0
  travel_short_distance_acceleration: 0
  travel_slope: 0
  travel_speed_z: 0
  wipe: 0
  wipe_tower: 1
  wipe_tower_bridging: 10
  wipe_tower_brim_width: 2
  wipe_tower_cone_angle: 0
  wipe_tower_extra_flow: '100%'
  wipe_tower_extra_spacing: '100%'
variants:
# 0.4
- condition: tool.nozzle_diameter == 0.4
  id: McTIXb/qT1bKUpB1Z8YQgQ
  values:
    max_layer_height: 0.3
    min_layer_height: 0.0375
    output_filename_format: '{input_filename_base}_0.4n_{layer_height}mm_{printing_filament_types}_{printer_model}_{print_time}.gcode'
# 0.6
- condition: tool.nozzle_diameter == 0.6
  id: bUYwiyC13XnIvBp2enbo8w
  values:
    max_layer_height: 0.45
    min_layer_height: 0.1
    output_filename_format: '{input_filename_base}_0.6n_{layer_height}mm_{printing_filament_types}_{printer_model}_{print_time}.gcode'
