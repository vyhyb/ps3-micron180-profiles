        G0 X20 Y4 F10000   ; Go to starting point
        G0 Z0.4            ; Raise Z to 0.4
        G91                ; Incremental positioning
        G1 X100 E35 F1200  ; Primeline
        G90
      autoemit_temperature_commands: false
      extruder_clearance_radius: 70
      printer_notes: |-
        Unoffical profile.
        E3DV6
      printer_model: 'MICRON180'
